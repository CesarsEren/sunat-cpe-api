# =====================================================
# sunat-cpe-api — Configuracion BASE (no por empresa)
# =====================================================
# Este archivo NO contiene credenciales ni datos sensibles.
# Las propiedades especificas de cada empresa (RUC, paths GRT, etc.)
# viven en src/main/resources/Empresas/<empresa>/application.properties
# y se filtran hacia config/ durante el build (mvn package).
#
# Para correr:
#   mvn spring-boot:run                                  (usa CruzCargo por default)
#   mvn spring-boot:run -Dempresa=Navitas                (usa el perfil Navitas)
#
# Compilar deploy:
#   mvn clean package -Dempresa=Navitas                  (genera target/sunat-cpe-api.jar)

server.port=8085
spring.application.name=sunat-cpe-api

# Ambiente por defecto (puede ser sobreescrito por cliente en cada request)
sunat.production=false

# Timeouts SOAP (SUNAT a veces responde lento)
sunat.soap.connect.timeout.ms=15000
sunat.soap.request.timeout.ms=60000

# Limite de archivos (zips firmados pueden ser > 1MB)
spring.http.multipart.max-file-size=20480KB
spring.http.multipart.max-request-size=20480KB

# Logging
logging.level.pe.encarga.sunatapi=INFO
logging.level.org.apache.commons.logging=INFO

# =====================================================
# Credenciales SOL SUNAT (vienen de variables de entorno)
# =====================================================
# Configurar antes de arrancar:
#   export SOL_USER="<RUC>MODDATOS"    ej: 20600520033MODDATOS
#   export SOL_PASSWORD="<clave_sol>"  ej: MODDATOS (beta)
#
# Si no se setean, el endpoint /api/v1/cpe/send respondera
# MISSING_CREDENTIALS para los casos que requieran enviar.
sunat.sol.user=${SOL_USER:}
sunat.sol.password=${SOL_PASSWORD:}

# =====================================================
# NOTA: app.api.grt.* NO se configura aca.
# Vive en Empresas/<empresa>/application.properties para
# que cada empresa tenga su RUC y credenciales propias.
# =====================================================
